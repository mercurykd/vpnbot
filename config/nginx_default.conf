user nginx;
worker_processes auto;

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

error_log /logs/nginx_error;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;
    server_tokens off;
    include override.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Proxy Cache storage - so we can cache the DoH response from the upstream
    proxy_cache_path /var/cache/nginx/doh_cache levels=1:2 keys_zone=doh_cache:10m;

    real_ip_header proxy_protocol;
    real_ip_recursive on;
    set_real_ip_from 10.10.0.10;

    server {
        listen 80 default_server;

        location / {
            return 301 https://$host$request_uri;
        }
        location ~\.well-known {
            access_log /logs/nginx_certbot_access;
            root /certs/;
            try_files $uri =404;
        }
    }

    server {
        listen 10.10.0.2:443 ssl proxy_protocol default_server;
        listen 10.10.1.2:443 ssl default_server;
        http2 on;
        ssl_certificate /certs/self_public;
        ssl_certificate_key /certs/self_private;

        access_log /logs/nginx_ip_access;

        location = / {
            root /app;
            try_files $uri /override.html @auth;
        }

        location /override/ {
            alias /app/override/;
            try_files $uri =404;
        }

        location / {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }
        location @auth {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }

        location /tlgrm {
            access_log /logs/nginx_tlgrm_access;
            proxy_pass http://php;
        }

        location @php {
            proxy_pass http://php;
        }

        location /adguard/ {
        }

        location /webapp {
            access_log /logs/nginx_webapp_access;
            alias /app;
            index index.html;
            try_files $uri $uri/ @php;
        }

        location /pac {
            access_log /logs/nginx_pac_access;
            proxy_set_header Host $http_host;
            proxy_pass http://php;
        }

        location /ws {
            proxy_pass http://xr:443;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5d;
        }

        location /v2ray {
            access_log /logs/nginx_v2ray_access;
            proxy_redirect off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_pass http://ss:8388/;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # WEB-режим telemt: приватный HTTP/1.1 листенер в контейнере tg (transport = "web").
        # Host и один X-Forwarded-For обязательны — по ним telemt считает реальный IP клиента
        # и проверяет capability (HMAC по host + base_path).
        location /tgweb {
            access_log /logs/nginx_tgweb_access;
            # telemt принимает bridge строго как /<base_path>/?bridge=..., а Telegram Desktop
            # присылает путь без завершающего слэша: добавляем его (rewrite работает и когда
            # hash в пути есть, и когда его нет), иначе telemt отдаёт локальный 404
            rewrite ^(/tgweb[^/]*)$ $1/ last;
            proxy_pass http://tg:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            # carrier = "https" (long polling): keep-alive до telemt, без Upgrade-хендшейка
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
        }

        # обратный прокси к api.telegram.org: /tg<hash>/bot<key>/getMe -> api.telegram.org/bot<key>/getMe
        # нужен, когда api.telegram.org недоступен напрямую; hash отсекается штатной заменой префикса
        # локации — поэтому здесь нет ни rewrite, ни if, ни переменных с $1
        location /tg/ {
            access_log /logs/nginx_tg_access;
            proxy_pass https://api.telegram.org/;
            proxy_ssl_server_name on;
            proxy_ssl_name api.telegram.org;
            # CA-бандла в alpine может не быть, а в перехватываемых сетях проверка рвет соединение
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host api.telegram.org;
            proxy_set_header Connection "";
            # бот может заливать файлы вплоть до 2ГБ
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering off;
            # getUpdates с timeout=50 не должен обрываться
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /dns-query {
            access_log /logs/nginx_doh_access;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $remote_addr;
            proxy_cache doh_cache;
            proxy_cache_key $scheme$proxy_host$uri$is_args$args$request_body;
            proxy_pass https://ad/dns-query;
        }
        include location.conf;
    }

    # внутренний миррор сайта — decoy для WEB-режима telemt:
    # запросы к cloak-пути без валидной capability видят обычные страницы/404.
    # Слушаем docker-адрес, чтобы decoy был доступен из контейнера tg — см. [web.vhosts.decoy]
    server {
        listen 10.10.0.2:8082;
        server_name _;

        root /app;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

